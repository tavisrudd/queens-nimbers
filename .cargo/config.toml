# Build for the host CPU so the bitboard kernels use POPCNT / BMI / AVX directly
# (count_ones -> POPCNT, `x & x.wrapping_neg()` -> BLSI).
#
# NOTE: this MUST live under [target.<triple>], not [build], because the global
# ~/.cargo/config.toml already sets [target.x86_64-unknown-linux-gnu].rustflags
# (the mold linker). Cargo merges arrays under the *same* key but a [build]
# rustflags would be shadowed by the more-specific [target.*] one. Using the
# target key here appends to it, so we get both mold and target-cpu.
#
# `native` is portable (it means "this host"); `make release` pins znver5
# explicitly for reproducible bench numbers on the Zen 5 box.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]
